<svg xmlns="http://www.w3.org/2000/svg" width="740mm" height="332mm" viewBox="0 0 740 332"><style>text{font-family:sans-serif;font-size:9px;fill:#222}.t{font-size:12px;font-weight:bold}.bois{fill:#e8cfa0;stroke:#5a3d1a;stroke-width:1}.vide{fill:#fff;stroke:#5a3d1a;stroke-width:1}.cache{fill:none;stroke:#5a3d1a;stroke-dasharray:4 3}.pv{fill:#25456b;stroke:#111}.cote{stroke:#c0392b;stroke-width:.6;fill:none}.cotet{fill:#c0392b}.trou{fill:#fff;stroke:#111}</style><rect width="740" height="332" fill="#fff"/><text class="t" x="10" y="16">Débit des pièces — cotes en mm</text><text x="20" y="34">Planche 20 × 180 (mini) — façade + dos dans un flan de 180 × 805, une coupe à 45°</text><polygon class="bois" points="20.0,40.0 206.0,40.0 314.0,148.0 20.0,148.0"/><polygon class="bois" points="206.0,40.0 500.0,40.0 500.0,148.0 314.0,148.0"/><text x="92.0" y="100">Façade</text><text x="380.0" y="100">Dos</text><line class="cote" x1="20.0" y1="160.0" x2="500.0" y2="160.0"/><text class="cotet" x="260.0" y="158.0" text-anchor="middle">805 (trait de scie à 45° compris)</text><text x="20" y="192.0">Pièces refendues : porte sud à 138, les autres à 140</text><rect class="bois" x="20.0" y="198.0" width="196.2" height="84.0"/><text x="23.0" y="212.0">Côté sud</text><text x="23.0" y="224.0">138 × 327</text><rect class="bois" x="218.0" y="198.0" width="294.0" height="84.0"/><text x="221.0" y="212.0">Côté nord</text><text x="221.0" y="224.0">140 × 490</text><rect class="bois" x="513.8" y="198.0" width="84.0" height="84.0"/><text x="516.8" y="212.0">Fond</text><text x="516.8" y="224.0">140 × 140</text><rect class="bois" x="599.6" y="198.0" width="84.0" height="84.0"/><text x="602.6" y="212.0">Cloison</text><text x="602.6" y="224.0">140 × 140</text><text x="20" y="308.0">Longueur totale de planche 180 : ≈ 2047 mm (bloc d’entrée compris), + toit 300 × 250 et barre 40 × 600 ; plaque de trappe 100 × 80 en 10 mm.</text></svg>
